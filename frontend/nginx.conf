server {
  listen 8080;
  server_name _;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Resolving `api` per request (through the variable below), instead of
  # once at startup, keeps the proxy working when the api container is recreated with a new IP.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:8800;

  # A stopped api fails fast (the page shows its error state) instead of hanging for 60s.
  proxy_connect_timeout 3s;
  proxy_set_header Host $host;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # proxy_pass without a URI part forwards the original request path: nothing is rewritten.
  location /api/ {
    proxy_pass $api_upstream;
  }

  location = /health {
    proxy_pass $api_upstream;
  }

  # Hashed build assets never change under the same name.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    include /etc/nginx/snippets/security-headers.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
