# Security headers for every response (security report, S8). Included by the server block and
# again by each location that sets its own add_header, since nginx does not inherit them there.
# The page loads only its own bundled scripts and styles, so the policy needs no 'unsafe-inline'.
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
