# Every variable has a default, so `docker compose up` works without a .env file.
# See .env.example for what each one does.

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ecommerce}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ecommerce}
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
    ports:
      # Only the host itself reaches the database (security report, S6).
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
      # Creates the ecommerce_test database the first time the volume is initialised.
      - ./docker/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # TCP check: the temporary server that runs init scripts listens only on the Unix socket.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@db:5432/${POSTGRES_DB:-ecommerce}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: runtime
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@db:5432/${POSTGRES_DB:-ecommerce}
      HOST: 0.0.0.0
      PORT: 8800
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Only the host itself reaches the API directly; the network goes through nginx (S7).
      - "127.0.0.1:${API_PORT:-8800}:8800"
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      seed-initial:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8800/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runtime
    ports:
      - "${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  # The demonstration data on the first `docker compose up`: seeds only a database with no
  # Products yet, so a fresh clone shows the seeded catalog and later `up`s keep their data.
  seed-initial:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: seed
    command: ["node", "scripts/seed.ts", "--if-empty"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@db:5432/${POSTGRES_DB:-ecommerce}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  # Synthetic data for demonstration, only on `make seed`: deletes and recreates every
  # Product, Coupon, Cart and Order of the application database.
  seed:
    profiles: ["seed"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: seed
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@db:5432/${POSTGRES_DB:-ecommerce}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: "no"

  test-unit:
    profiles: ["test"]
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: test

  test-integration:
    profiles: ["test"]
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: test
    environment:
      TEST_DATABASE_URL: postgres://${POSTGRES_USER:-ecommerce}:${POSTGRES_PASSWORD:-ecommerce}@db:5432/ecommerce_test
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
